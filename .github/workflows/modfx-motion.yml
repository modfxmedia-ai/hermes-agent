name: modfx-motion (typecheck)

# Scoped to the motion engine only — this is a TypeScript/Remotion project
# living beside the Python agent, so it gets its own gate rather than being
# bolted onto the Python test matrix.
#
# Typecheck only, deliberately. A full render needs Chromium plus a software
# GL context and takes minutes per film; that belongs in a manual or
# scheduled job, not on every push. The output-level check is
# `scripts/qa-frames.mjs`, which exits non-zero on a dead frame and can gate
# a render job when one is added.

on:
  push:
    branches: [main]
    paths:
      - "modfx-motion/**"
      - ".github/workflows/modfx-motion.yml"
  pull_request:
    paths:
      - "modfx-motion/**"
      - ".github/workflows/modfx-motion.yml"

permissions:
  contents: read

concurrency:
  group: modfx-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modfx-motion
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modfx-motion/package-lock.json

      # Remotion pulls its own Chromium on postinstall in some setups; the
      # typecheck job never renders, so skip the download entirely.
      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          REMOTION_SKIP_CHROMIUM_DOWNLOAD: "1"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Syntax-check scripts
        run: |
          for f in scripts/*.mjs; do
            node --check "$f"
          done
